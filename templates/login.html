<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StudyMate AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(122, 91, 240, 0.13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(77, 150, 255, 0.13),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #f8f9ff,
                    #eef3ff,
                    #f8f4ff
                );

            color: #152957;
        }

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 470px;

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid rgba(220, 225, 245, 0.9);

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(55, 67, 120, 0.14);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;

            background:
                linear-gradient(
                    135deg,
                    #6855f5,
                    #8b6cff
                );

            box-shadow:
                0 10px 25px rgba(104, 85, 245, 0.28);
        }

        h1 {
            text-align: center;

            font-size: 32px;

            color: #132653;
        }

        h1 span {
            color: #6b55ed;
        }

        .subtitle {
            margin-top: 10px;

            text-align: center;

            color: #687594;

            font-size: 16px;

            line-height: 1.5;
        }

        .login-form {
            margin-top: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #263b69;

            font-size: 15px;

            font-weight: 600;
        }

        .field input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d9deef;

            border-radius: 13px;

            background: #ffffff;

            color: #172b55;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .field input:focus {
            border-color: #7c68ed;

            box-shadow:
                0 0 0 3px rgba(124, 104, 237, 0.12);
        }

        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #6855f5,
                    #816cf3
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(104, 85, 245, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(104, 85, 245, 0.3);
        }

        .message {
            margin-top: 18px;

            padding: 11px 14px;

            border-radius: 10px;

            background: #fff0f0;

            color: #c0392b;

            font-size: 14px;

            text-align: center;
        }

        .register-text {
            margin-top: 24px;

            text-align: center;

            color: #707b96;

            font-size: 14px;
        }

        .register-text a {
            color: #6855f5;

            font-weight: 700;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-button {
            display: flex;

            justify-content: center;

            margin-top: 22px;

            color: #66718d;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .back-button:hover {
            color: #6b55ed;
        }

        @media (max-width: 600px) {

            .page {
                padding: 20px;
            }

            .card {
                padding: 38px 24px;
            }

            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="logo">
            🎓
        </div>

        <h1>
            Welcome Back to <span>StudyMate AI</span>
        </h1>

        <p class="subtitle">
            Login to continue your learning journey.
        </p>


        <form
            method="POST"
            action="{{ url_for('login') }}"
            class="login-form"
        >

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <p class="register-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create Account
            </a>
        </p>


        <a
            href="{{ url_for('account_choice') }}"
            class="back-button"
        >
            ← Back to Continue
        </a>

    </div>

</div>

</body>

</html>
