<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Continue - StudyMate AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at 15% 20%, rgba(122, 91, 240, 0.13), transparent 25%),
                radial-gradient(circle at 85% 80%, rgba(77, 150, 255, 0.13), transparent 25%),
                linear-gradient(135deg, #f8f9ff, #eef3ff, #f8f4ff);

            color: #152957;
        }

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 560px;

            padding: 48px 42px;

            text-align: center;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(220, 225, 245, 0.9);

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(55, 67, 120, 0.14);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            background: linear-gradient(135deg, #6855f5, #8b6cff);

            box-shadow:
                0 10px 25px rgba(104, 85, 245, 0.28);
        }

        h1 {
            font-size: 34px;
            color: #132653;
        }

        h1 span {
            color: #6b55ed;
        }

        .subtitle {
            margin-top: 12px;

            color: #687594;

            font-size: 17px;
            line-height: 1.5;
        }

        .options {
            margin-top: 35px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .option {
            padding: 25px 18px;

            border-radius: 22px;

            text-decoration: none;

            background: #ffffff;

            border: 1px solid #e2e5f4;

            box-shadow:
                0 8px 20px rgba(60, 70, 120, 0.07);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .option:hover {
            transform: translateY(-5px);

            border-color: #9c8df5;

            box-shadow:
                0 14px 28px rgba(85, 70, 160, 0.14);
        }

        .option-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .login-icon {
            background: #e4edff;
        }

        .register-icon {
            background: #eee5ff;
        }

        .option h2 {
            font-size: 20px;
            color: #1d3566;
        }

        .option p {
            margin-top: 7px;

            font-size: 14px;
            line-height: 1.4;

            color: #74809d;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-top: 32px;

            color: #66718d;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: #6b55ed;
        }

        @media (max-width: 600px) {

            .page {
                padding: 20px;
            }

            .card {
                padding: 38px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="logo">
            🎓
        </div>

        <h1>
            Welcome to <span>StudyMate AI</span>
        </h1>

        <p class="subtitle">
            Choose how you want to continue your learning journey.
        </p>


        <div class="options">

            <a href="{{ url_for('login') }}" class="option">

                <div class="option-icon login-icon">
                    🔐
                </div>

                <h2>Login</h2>

                <p>
                    Already have an account?
                    Sign in to continue.
                </p>

            </a>


            <a href="{{ url_for('register') }}" class="option">

                <div class="option-icon register-icon">
                    📝
                </div>

                <h2>Create Account</h2>

                <p>
                    New to StudyMate AI?
                    Create your account.
                </p>

            </a>

        </div>


        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Get Started
        </a>

    </div>

</div>

</body>
</html>
